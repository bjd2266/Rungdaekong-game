<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9bdcff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>렁대콩의 모험 ONLINE</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif;background:#9bdcff}
#app{position:fixed;inset:0;overflow:hidden}canvas{width:100%;height:100%;display:block}
.hud{position:absolute;z-index:5;left:12px;top:calc(10px + env(safe-area-inset-top));font-weight:900;color:#17351e;text-shadow:0 1px #fff}
#bossHud{position:absolute;z-index:5;top:calc(65px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(72vw,520px);display:none;text-align:center;font-weight:900;color:#7a1d1d}
.bar{height:14px;border:3px solid #421;background:#fff;border-radius:10px;overflow:hidden}.fill{height:100%;background:#d83232;width:100%}
.tools{position:absolute;z-index:6;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:7px}
button,input{font:inherit}.sm{border:0;border-radius:13px;padding:8px 11px;background:#ffffffdf;font-weight:900}
.overlay{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#9bdcffee,#fffffff5);padding:18px;overflow:auto}
.card{width:min(94vw,620px);text-align:center;color:#17351e}.bean{font-size:64px}.card h1{font-size:clamp(32px,9vw,62px);line-height:.95;margin:5px 0}.sub{font-weight:750}
.primary{border:0;border-radius:999px;padding:15px 28px;background:#2d9f49;color:#fff;font-size:20px;font-weight:1000;box-shadow:0 6px #1f7333;margin:9px}
.secondary{border:0;border-radius:999px;padding:11px 18px;background:#fff;color:#24422a;font-weight:900;margin:5px;box-shadow:0 2px 10px #0002}
.namebox{width:min(310px,86vw);border:3px solid #b6d9bc;border-radius:15px;padding:12px 14px;font-weight:900;text-align:center;outline:none;background:#fff}
.skinrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.skin{width:62px;height:62px;border:3px solid transparent;border-radius:18px;font-size:32px;background:#ffffffc9}.skin.sel{border-color:#2d9f49}
.rank{margin:12px auto;padding:12px;background:#ffffffb8;border-radius:18px;text-align:left;max-width:430px}.rank h3{margin:0 0 8px;text-align:center}.rank ol{margin:0;padding-left:30px}.rank li{padding:3px 0}.me{font-weight:1000;color:#167436}.note{font-size:12px;opacity:.72;margin-top:8px}
.status{font-size:13px;font-weight:800;min-height:20px}.tabs{display:flex;justify-content:center;gap:6px}.tab{border:0;border-radius:99px;padding:7px 12px;font-weight:900;background:#ffffff99}.tab.active{background:#2d9f49;color:#fff}
#toast{position:absolute;z-index:30;left:50%;top:80px;transform:translateX(-50%);padding:9px 14px;border-radius:99px;background:#17351eee;color:#fff;font-weight:800;opacity:0;transition:.2s}#toast.show{opacity:1}
</style></head>
<body><div id="app">
<canvas id="game"></canvas>
<div class="hud"><div id="score">점수 0</div><div id="best">내 최고 0</div><div id="jumps">점프 ●●</div></div>
<div id="bossHud"><div>👹 콩먹보 대왕</div><div class="bar"><div class="fill" id="bossFill"></div></div></div>
<div class="tools"><button class="sm" id="sound">🎵</button><button class="sm" id="share">공유</button></div>
<div id="toast"></div>
<div class="overlay" id="overlay"><div class="card">
<div class="bean">🫘</div><h1>렁대콩의 모험</h1><h2>ONLINE</h2>
<p class="sub">2단 점프 · 보스전 · 스킨 · 배경음악 · 🌎 통합랭킹</p>
<input id="nickname" class="namebox" maxlength="10" placeholder="랭킹에 쓸 닉네임 (2~10자)">
<div><b>캐릭터 스킨</b></div><div class="skinrow" id="skins"></div>
<button class="primary" id="start">게임 시작</button>
<div class="rank">
  <h3>🌎 실시간 통합 TOP 10</h3>
  <ol id="onlineRanking"><li>불러오는 중...</li></ol>
  <div class="status" id="rankStatus"></div>
</div>
<p class="note">점수는 게임 오버 시 서버에 자동 등록됩니다. 닉네임별 최고점수만 랭킹에 반영됩니다.</p>
</div></div>
</div>
<script>
(()=>{
const API='/.netlify/functions/leaderboard';
const app=document.querySelector('#app'),cv=document.querySelector('#game'),c=cv.getContext('2d'),ov=document.querySelector('#overlay');
const scoreE=document.querySelector('#score'),bestE=document.querySelector('#best'),jumpE=document.querySelector('#jumps'),bossHud=document.querySelector('#bossHud'),bossFill=document.querySelector('#bossFill');
const skins=[['green','🫘','#69b96b'],['pink','🌸','#ef82a8'],['gold','👑','#e9b83f'],['ice','❄️','#69c9df'],['ninja','🥷','#565a67']];
let skin=localStorage.getItem('rdk_skin')||'green',best=+(localStorage.getItem('rdk_best_online')||0),nickname=localStorage.getItem('rdk_nick')||'';
let W,H,ground,state='menu',score=0,speed=7,last=performance.now(),spawn=70,obs=[],shots=[],boss=null,soundOn=true,audio=null,musicTimer=null,startedAt=0;
const p={x:100,y:0,w:58,h:72,vy:0,jumps:0};
function col(){return skins.find(x=>x[0]===skin)?.[2]||'#69b96b'}
function fit(){let d=Math.min(devicePixelRatio||1,2),r=app.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;c.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;ground=H*.82;p.x=Math.max(55,W*.15);p.w=Math.max(48,Math.min(62,W*.065));p.h=p.w*1.22;if(state!=='play')p.y=ground-p.h}
function tone(f,d=.06,v=.035,type='square'){if(!soundOn)return;try{audio||=new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type=type;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function music(){clearInterval(musicTimer);if(!soundOn||state!=='play')return;let seq=[262,330,392,523,392,330],i=0;musicTimer=setInterval(()=>tone(seq[i++%seq.length],.12,.011,'triangle'),230)}
function toast(m){let t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1500)}
function renderSkins(){let box=document.querySelector('#skins');box.innerHTML='';skins.forEach(s=>{let b=document.createElement('button');b.className='skin '+(skin===s[0]?'sel':'');b.textContent=s[1];b.onclick=()=>{skin=s[0];localStorage.setItem('rdk_skin',skin);renderSkins();tone(600)};box.appendChild(b)})}
async function loadRanking(){
 const el=document.querySelector('#onlineRanking'),st=document.querySelector('#rankStatus');
 if(!el)return; st.textContent='랭킹 서버 연결 중...';
 try{
   const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw Error();
   const d=await r.json(); el.innerHTML='';
   (d.leaderboard||[]).slice(0,10).forEach((x,i)=>{let li=document.createElement('li');li.innerHTML=`<b>${escapeHtml(x.name)}</b> — ${x.score}점`;if(x.name===nickname)li.className='me';el.appendChild(li)});
   if(!d.leaderboard?.length)el.innerHTML='<li>아직 기록이 없습니다. 1등에 도전!</li>';
   st.textContent='실시간 서버 랭킹';
 }catch(e){el.innerHTML='<li>랭킹 서버 연결 실패</li>';st.textContent='Netlify Functions 배포 여부를 확인하세요.'}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function submitScore(s,duration){
 try{
  let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nickname,score:s,duration:Math.round(duration)})});
  let d=await r.json(); if(!r.ok)throw Error(d.error||'등록 실패'); toast(d.personalBest?'🎉 통합랭킹 신기록!':'점수 등록 완료'); return true;
 }catch(e){toast('랭킹 등록 실패');return false}
}
function validName(n){return /^[가-힣A-Za-z0-9_]{2,10}$/.test(n)}
function reset(){score=0;speed=7;spawn=65;obs=[];shots=[];boss=null;p.y=ground-p.h;p.vy=0;p.jumps=0;bossHud.style.display='none';scoreE.textContent='점수 0';jumpE.textContent='점프 ●●'}
function start(){
 let inp=document.querySelector('#nickname'); if(inp){nickname=inp.value.trim()}
 if(!validName(nickname)){toast('닉네임은 한글/영문/숫자 2~10자로 입력');return}
 localStorage.setItem('rdk_nick',nickname);reset();state='play';startedAt=Date.now();ov.style.display='none';music()
}
function jump(){if(state!=='play'||p.jumps>=2)return;p.vy=p.jumps===0?-16:-14;p.jumps++;jumpE.textContent='점프 '+('●'.repeat(2-p.jumps)+'○'.repeat(p.jumps));tone(p.jumps===1?620:820)}
function addObs(){let h=45+Math.random()*50,w=35+Math.random()*30;obs.push({x:W+30,y:ground-h,w,h});spawn=65+Math.random()*65-Math.min(25,speed)}
function summonBoss(){boss={x:W-120,y:ground-150,w:95,h:150,t:0,shot:70};bossHud.style.display='block';tone(120,.5,.05,'sawtooth')}
function hit(a,b,pad=.14){return a.x+a.w*pad<b.x+b.w&&a.x+a.w*(1-pad)>b.x&&a.y+a.h*pad<b.y+b.h&&a.y+a.h*(1-pad)>b.y}
async function over(){
 state='over';clearInterval(musicTimer);tone(120,.3,.05,'sawtooth');let s=Math.floor(score),dur=(Date.now()-startedAt)/1000;
 if(s>best){best=s;localStorage.setItem('rdk_best_online',best)}bestE.textContent='내 최고 '+best;
 await submitScore(s,dur);
 ov.innerHTML=`<div class="card"><div class="bean">💥</div><h1>게임 오버</h1><p class="sub">${escapeHtml(nickname)} · ${s}점 · 내 최고 ${best}점</p>
 <button class="primary" id="again">다시 도전</button><button class="secondary" id="home">메뉴/랭킹</button>
 <div class="rank"><h3>🌎 실시간 통합 TOP 10</h3><ol id="onlineRanking"><li>불러오는 중...</li></ol><div class="status" id="rankStatus"></div></div></div>`;
 ov.style.display='flex';document.querySelector('#again').onclick=start;document.querySelector('#home').onclick=()=>location.reload();loadRanking()
}
function update(dt){if(state!=='play')return;let q=dt/16.667;score+=.13*q;speed=Math.min(15,7+score/140);scoreE.textContent='점수 '+Math.floor(score);
p.vy+=.9*q;p.y+=p.vy*q;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0;p.jumps=0;jumpE.textContent='점프 ●●'}
if(!boss&&Math.floor(score)>0&&Math.floor(score)%250<1&&obs.length<2)summonBoss();
if(!boss){spawn-=q;if(spawn<=0)addObs()}for(let o of obs)o.x-=speed*q;obs=obs.filter(o=>o.x+o.w>0);for(let o of obs)if(hit(p,o))return over();
if(boss){boss.t+=q;boss.y=ground-boss.h-Math.sin(boss.t*.04)*25;boss.shot-=q;if(boss.shot<=0){shots.push({x:boss.x,y:boss.y+65,w:30,h:30,v:8+speed*.25});boss.shot=55+Math.random()*40;tone(180,.08,.025,'sawtooth')}
for(let s of shots)s.x-=s.v*q;shots=shots.filter(s=>s.x+s.w>0);for(let s of shots)if(hit(p,s,.2))return over();
if(boss.t>420){boss=null;shots=[];bossHud.style.display='none';score+=100;tone(900,.2,.04,'triangle')}}
}
function bean(x,y,w,h){c.save();c.translate(x+w/2,y+h/2);c.fillStyle=col();c.strokeStyle='#2f5e38';c.lineWidth=4;c.beginPath();c.moveTo(-w*.28,-h*.38);c.bezierCurveTo(-w*.55,-h*.15,-w*.45,h*.35,-w*.05,h*.44);c.bezierCurveTo(w*.35,h*.52,w*.52,h*.08,w*.33,-h*.3);c.bezierCurveTo(w*.18,-h*.52,-w*.1,-h*.52,-w*.28,-h*.38);c.closePath();c.fill();c.stroke();c.fillStyle='#17291a';c.beginPath();c.arc(-w*.1,-h*.07,3.5,0,7);c.arc(w*.16,-h*.07,3.5,0,7);c.fill();c.strokeStyle='#17291a';c.lineWidth=3;c.beginPath();c.arc(w*.03,h*.07,w*.12,.15*Math.PI,.85*Math.PI);c.stroke();if(skin==='gold'){c.font=`${w*.55}px serif`;c.fillText('👑',-w*.28,-h*.38)}if(skin==='ninja'){c.fillStyle='#222';c.fillRect(-w*.35,-h*.18,w*.75,h*.18)}c.restore()}
function draw(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bd7ff');g.addColorStop(.7,'#eefaff');g.addColorStop(.71,'#a8df83');g.addColorStop(1,'#5da44b');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#ffd34d';c.beginPath();c.arc(W*.84,H*.13,35,0,7);c.fill();c.fillStyle='#5a9d47';c.fillRect(0,ground,W,H-ground);
for(let o of obs){c.fillStyle='#795548';c.strokeStyle='#4e342e';c.lineWidth=4;c.fillRect(o.x,o.y,o.w,o.h);c.strokeRect(o.x,o.y,o.w,o.h)}
for(let s of shots){c.fillStyle='#ff5722';c.beginPath();c.arc(s.x+s.w/2,s.y+s.h/2,s.w/2,0,7);c.fill();c.fillStyle='#ffd54f';c.beginPath();c.arc(s.x+s.w/2,s.y+s.h/2,s.w/4,0,7);c.fill()}
if(boss){c.font=`${boss.w*.75}px serif`;c.fillText('👹',boss.x,boss.y+boss.h*.65);c.fillStyle='#54231f';c.fillRect(boss.x+15,boss.y+boss.h*.62,65,boss.h*.38)}
c.fillStyle='#0002';c.beginPath();c.ellipse(p.x+p.w/2,ground+5,p.w*.45,7,0,0,7);c.fill();bean(p.x,p.y,p.w,p.h)}
function loop(n){let dt=Math.min(34,n-last);last=n;update(dt);draw();requestAnimationFrame(loop)}
document.querySelector('#nickname').value=nickname;document.querySelector('#start').onclick=start;
app.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input')&&state==='play')jump()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();state==='play'?jump():start()}});
document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'🎵':'🔇';music()};
document.querySelector('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'렁대콩의 모험 ONLINE',text:'내 기록을 깨봐! 🫘',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('주소 복사됨!')}}catch(e){}};
bestE.textContent='내 최고 '+best;renderSkins();loadRanking();fit();addEventListener('resize',fit);requestAnimationFrame(loop)
})();
</script></body></html>
